name: Backend
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    env:
      RUST_TEST_THREADS: '4'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/check-architecture.test.mjs
      - run: node scripts/check-architecture.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --all-targets --locked
  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/smoke-docker.sh
  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.9.0
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web check
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web test:e2e
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p chunkyard-server --locked
      - run: node scripts/smoke-ui.mjs
      - run: node scripts/smoke-editor-integrations.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openapi-spec-validator==0.7.2
      - run: openapi-spec-validator crates/api/src/openapi.json
