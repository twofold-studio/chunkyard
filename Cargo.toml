[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
mcm-core = { path = "crates/mcm-core" }
mcm-download = { path = "crates/mcm-download" }
mcm-fs = { path = "crates/mcm-fs" }
mcm-java = { path = "crates/mcm-java" }
mcm-db = { path = "crates/mcm-db" }
mcm-config = { path = "crates/mcm-config" }
mcm-auth = { path = "crates/mcm-auth" }
mcm-api = { path = "crates/mcm-api" }
mcm-jobs = { path = "crates/mcm-jobs" }
mcm-process = { path = "crates/mcm-process" }
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
rand = "0.8"
subtle = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
url = "2"
async-trait = "0.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
mcm-install = { path = "crates/mcm-install" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
