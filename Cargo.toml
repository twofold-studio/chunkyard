[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
chunkyard-core = { path = "crates/core" }
chunkyard-download = { path = "crates/download" }
chunkyard-fs = { path = "crates/fs" }
chunkyard-db = { path = "crates/db" }
chunkyard-config = { path = "crates/config" }
chunkyard-auth = { path = "crates/auth" }
chunkyard-api = { path = "crates/api" }
chunkyard-jobs = { path = "crates/jobs" }
chunkyard-process = { path = "crates/process" }
argon2 = "0.5"
axum = "0.8"
utoipa = { version = "=5.4.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "=0.2.0"
base64 = "0.22"
rand = "0.8"
subtle = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
url = "2"
async-trait = "0.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
chunkyard-install = { path = "crates/install" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true
