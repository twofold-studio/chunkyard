data_dir = "data"

[http]
# Built SPA directory; CHUNKYARD_HTTP__UI_DIR="" disables UI hosting.
ui_dir = "web/build"
# Show the optional version/changelog UI; CHUNKYARD_HTTP__SHOW_VERSION=false hides it.
show_version = true
listen = "127.0.0.1:8420"
# public_url = "https://minecraft.example.com"
# Non-loopback HTTP requires this explicit opt-in; HTTPS reverse proxies do not.
allow_insecure_http = false

[java]
allow_system_java = true

[auth]
# Override with CHUNKYARD_AUTH__ENABLED=false for a trusted local/VPN environment.
enabled = true

[docker]
enabled = true
runtime_image = "eclipse-temurin:21-jre"
publish_ip = "0.0.0.0"
stop_timeout_s = 60
# user = "1000:1000"
# When mcm runs in Docker, set this to the host path mounted as its data_dir.
# host_data_dir = "/srv/mcm"
[curseforge]
# Supply privately through CHUNKYARD_CURSEFORGE__API_KEY in production.
# api_key = ""
