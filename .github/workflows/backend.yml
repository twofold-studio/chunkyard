name: Backend
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Probe a real system Java
        shell: pwsh
        run: |
          $javaExecutable = if ($IsWindows) { "java.exe" } else { "java" }
          cargo run -p mcm-server --locked -- java inspect (Join-Path $env:JAVA_HOME "bin/$javaExecutable")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --all-targets --locked
  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/smoke-docker.sh
  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.9.0
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web check
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mcm-server --locked
      - run: node scripts/smoke-ui.mjs
